server:
  port: 8080

spring:
  application:
    name: coordinator-service

coordinator:
  http:
    connect-timeout-ms: 2000
    read-timeout-ms: 2500
  health-check:
    enabled: true
    interval-ms: 5000
    timeout-ms: 2000
    failure-threshold: 2
    success-threshold: 2
  retry:
    max-attempts: 3
    initial-backoff-ms: 200
    backoff-multiplier: 2.0
    max-backoff-ms: 1000
  zones:
    - id: "NORTH"
      name: "North District"
      url: ${ZONE_NORTH_URL:http://localhost:8081}
    - id: "CENTRAL"
      name: "Central District"
      url: ${ZONE_CENTRAL_URL:http://localhost:8082}
    - id: "SOUTH"
      name: "South District"
      url: ${ZONE_SOUTH_URL:http://localhost:8083}

logging:
  level:
    root: INFO
    com.traffic: DEBUG
    org.springframework.web: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - [COORDINATOR] %msg%n"
