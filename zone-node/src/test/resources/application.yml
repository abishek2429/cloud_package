server:
  port: 8081

spring:
  application:
    name: zone-node-test
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
    open-in-view: false

zone:
  id: NORTH
  name: North Test Zone

logging:
  level:
    root: INFO
    com.traffic: DEBUG
